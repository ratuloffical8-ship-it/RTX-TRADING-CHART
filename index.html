<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RTX Chart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="view-chart">
<div id="app">

  <header id="topbar">
    <div class="row1">
      <select id="symbol" aria-label="Symbol"></select>
      <div id="price"><b id="price-val">--</b><span id="price-chg"></span></div>
      <span id="status" class="dot off" title="Live status"></span>
      <div class="spacer"></div>
      <button id="btn-indicators" class="icon" hidden title="Indicators">ƒx</button>
      <button id="btn-fs" class="icon" title="Fullscreen / Landscape">⛶</button>
    </div>
    <div id="tfbar"></div>
  </header>

  <main>
    <section id="view-chart" class="view active">
      <aside id="toolbar"></aside>
      <div id="chart-wrap">
        <div id="legend"></div>
        <div id="chart"></div>
        <div id="loading">লোড হচ্ছে…</div>
      </div>
    </section>
    <section id="view-learn" class="view"></section>
    <section id="view-tasks" class="view"></section>
  </main>

  <nav id="bottomnav">
    <button class="active" data-view="chart"><i>📈</i><span>চার্ট</span></button>
    <button data-view="learn"><i>📚</i><span>শেখা</span></button>
    <button data-view="tasks"><i>✅</i><span>টাস্ক</span></button>
  </nav>

  <div id="toast"></div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="js/data.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
      </html>
