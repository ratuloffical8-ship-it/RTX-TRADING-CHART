<!DOCTYPE html>
<!-- ফাইলের নাম: index.html | পাথ: index.html (GitHub রিপোর রুটে) -->
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RTX Chart</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/extra.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="RTX Chart">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body class="view-chart">
<div id="app">

  <header id="topbar">
    <div class="row1">
      <select id="symbol" aria-label="Symbol"></select>
      <div id="price"><b id="price-val">--</b><span id="price-chg"></span></div>
      <span id="status" class="dot off" title="Live status"></span>
      <div class="spacer"></div>
      <button id="btn-ultra" class="icon" title="RTX ULTRA PRO MAX">⚡</button>
      <button id="btn-indicators" class="icon" hidden title="Indicators">ƒx</button>
      <button id="btn-fs" class="icon" title="Fullscreen / Landscape">⛶</button>
    </div>
    <div id="tfbar"></div>
  </header>

  <main>
    <section id="view-chart" class="view active">
      <aside id="toolbar"></aside>
      <div id="chart-col">
        <div id="chart-wrap">
          <div id="legend"></div>
          <div id="chart"></div>
          <div id="loading">লোড হচ্ছে…</div>
        </div>
        <div id="panels"></div>
      </div>
    </section>
        <section id="view-tasks" class="view"></section>
    <section id="view-journal" class="view"></section>
    <section id="view-tools" class="view"></section>
    <section id="view-tv" class="view"></section>
  </main>

  <nav id="bottomnav">
    <button class="active" data-view="chart"><i>📈</i><span>চার্ট</span></button>
    <button data-view="tasks"><i>🏫</i><span>স্কুল</span></button>
    <button data-view="journal"><i>📝</i><span>জার্নাল</span></button>
    <button data-view="tools"><i>🧮</i><span>টুলস</span></button>
    <button data-view="tv"><i>🌐</i><span>TV</span></button>
  </nav>

  <div id="toast"></div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="js/data.js"></script>
<script src="js/chart.js"></script>
<script src="js/panels.js"></script>
<script src="js/tools.js"></script>
<script src="js/paper.js"></script>
<script src="js/regime.js"></script>
<script src="js/structure.js"></script>
<script src="js/trade.js"></script>
<script src="js/power.js"></script>
<script src="js/decision.js"></script>
<script src="js/raid.js"></script>
<script src="js/optimize.js"></script>
<script src="js/analytics.js"></script>
<script src="js/help.js"></script>
<script src="js/ultra.js"></script>
<script src="js/ai.js"></script>
<script src="js/course.js"></script>
<script src="js/school.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
  </html>
